name: Deploy SoundCloud Resolver

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/sc-resolve/**"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy SoundCloud resolver
        run: supabase functions deploy sc-resolve --project-ref igcmeihdkxkczzgneioa
